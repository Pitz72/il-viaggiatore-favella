# Il collaudo intero: un solo elenco, richiamato dalla CI (ci.yml) e dal rilascio (rilascio.yml).
#
#  1. versioni coerenti (strumenti/versione.mjs verifica), diario e registro dei materiali in ordine,
#     le prove del processo principale desktop e della data;
#  2. il codice dell'app: i tipi (tsc) e le regole dei hook React (ESLint);
#  3. collaudo dell'avventura: compilazione, i nove finali, le prove mirate,
#     i salvataggi (salva → ricarica → stato identico), e tutti gli altri;
#  4. il giro corto dell'esploratore (partite a caso), che non blocca: segnala
#     anomalie da guardare a mano, ma un'anomalia non è per forza un difetto del commit.
#
#  Fino alla 1.41.0 il rilascio aveva un suo elenco, più corto: due elenchi si disallineano.
name: Collaudo

on:
  workflow_call:
    inputs:
      partite:
        description: "Partite a caso del collaudo dei salvataggi"
        type: number
        default: 16

permissions:
  contents: read

jobs:
  collaudo:
    name: Versioni e collaudo
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Versioni coerenti
        run: node strumenti/versione.mjs verifica
      - name: Diario di sviluppo ben formato
        run: node strumenti/diario.mjs verifica
      - name: Registro dei materiali in ordine
        run: node strumenti/diario.mjs registro
      - name: Prove del processo principale (registro, IPC, salvataggi) e della data
        run: |
          node desktop/prove.cjs
          node strumenti/prova-data.mjs
      - name: Dipendenze dell'app
        run: npm ci --prefix app
      - name: I tipi e le regole dei hook React
        working-directory: app
        run: |
          npx tsc --noEmit -p .
          npm run controlla
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install lark==1.3.1
      - name: Compilazione
        run: python motore/favella.py compila prototipo/il-viaggiatore.fav
      - name: I nove finali
        working-directory: collaudo
        run: python finali.py
      - name: Prove mirate
        working-directory: collaudo
        run: python mirate.py
      - name: Salvataggi
        working-directory: collaudo
        run: python salvataggi.py -n ${{ inputs.partite }}
      - name: Bere e mangiare
        working-directory: collaudo
        run: python scorte.py
      - name: Il ponte dell'interfaccia
        working-directory: collaudo
        run: python interfaccia.py
      - name: I fili del viaggio e il guado
        working-directory: collaudo
        run: python fili.py
      - name: Le partite giocate a mano
        working-directory: collaudo
        run: python giocate.py
      - name: Le scelte che chiedono conferma, il testo del motore, le opzioni, la sequenza finale
        run: |
          python collaudo/conferme.py
          python collaudo/testo.py
          node app/scripts/opzioni-node.mjs
          node app/scripts/posti-node.mjs
          node app/scripts/trofei-prove.mjs
          node app/scripts/finale-node.mjs
      - name: I finali, le morti e i gesti giocati solo con i pulsanti
        run: python collaudo/pulsanti.py
      - name: La mappa (le tappe, i luoghi visitati, i nomi che non si toccano)
        run: python collaudo/mappa.py
      - name: I trofei (le partite di collaudo e le regole vere)
        run: python collaudo/trofei.py
      - name: La musica delle zone e la colonna sonora
        run: python collaudo/musica.py
      - name: La voce del doppiaggio (ogni testo stampato trova il suo audio)
        run: python collaudo/doppiaggio.py
      - name: La traduzione inglese (ogni testo stampato trova la sua traduzione)
        run: python collaudo/traduzione.py
      - name: L'esploratore (giro corto, non blocca)
        continue-on-error: true
        timeout-minutes: 6
        working-directory: collaudo
        run: python esploratore.py -n 5 -t 150
