# Integrazione continua: a ogni push e pull request.
#
#  1. versioni coerenti (strumenti/versione.mjs verifica);
#  2. collaudo dell'avventura: compilazione, i nove finali, le prove mirate,
#     i salvataggi (salva → ricarica → stato identico);
#  3. pacchetti desktop Windows e Linux costruiti e AUTOVERIFICATI (il gioco
#     vero parte dentro il pacchetto, gioca, salva e ricarica).
#
#  Il giro corto dell'esploratore (partite a caso) non blocca: segnala anomalie
#  da guardare a mano, ma un'anomalia non è per forza un difetto del commit.
#
#  Qui non si pubblica niente: le release le crea solo il workflow «Rilascio»,
#  a mano, dalla scheda Actions.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collaudo:
    name: Versioni e collaudo
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Versioni coerenti
        run: node strumenti/versione.mjs verifica
      - name: Diario di sviluppo ben formato
        run: node strumenti/diario.mjs verifica
      - name: Prove del processo principale (registro, IPC) e della data
        run: |
          node desktop/prove.cjs
          node strumenti/prova-data.mjs
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install lark==1.3.1
      - name: Compilazione
        run: python motore/favella.py compila prototipo/il-viaggiatore.fav
      - name: I nove finali
        working-directory: collaudo
        run: python finali.py
      - name: Prove mirate
        working-directory: collaudo
        run: python mirate.py
      - name: Salvataggi
        working-directory: collaudo
        run: python salvataggi.py -n 16
      - name: Bere e mangiare
        working-directory: collaudo
        run: python scorte.py
      - name: Il ponte dell'interfaccia
        working-directory: collaudo
        run: python interfaccia.py
      - name: I fili del viaggio e il guado
        working-directory: collaudo
        run: python fili.py
      - name: Le partite giocate a mano
        working-directory: collaudo
        run: python giocate.py
      - name: Le scelte che chiedono conferma, il testo del motore, le opzioni, la sequenza finale
        run: |
          npm ci --prefix app
          python collaudo/conferme.py
          python collaudo/testo.py
          node app/scripts/opzioni-node.mjs
          node app/scripts/posti-node.mjs
          node app/scripts/trofei-prove.mjs
          node app/scripts/finale-node.mjs
      - name: I finali, le morti e i gesti giocati solo con i pulsanti
        run: python collaudo/pulsanti.py
      - name: La mappa (le tappe, i luoghi visitati, i nomi che non si toccano)
        run: python collaudo/mappa.py
      - name: I trofei (le partite di collaudo e le regole vere)
        run: python collaudo/trofei.py
      - name: La musica delle zone e la colonna sonora
        run: python collaudo/musica.py
      - name: La voce del doppiaggio (ogni testo stampato trova il suo audio)
        run: python collaudo/doppiaggio.py
      - name: L'esploratore (giro corto, non blocca)
        continue-on-error: true
        timeout-minutes: 6
        working-directory: collaudo
        run: python esploratore.py -n 5 -t 150

  desktop:
    name: Pacchetto ${{ matrix.nome }}
    needs: collaudo
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: Windows
            builder: --win nsis
          - os: ubuntu-latest
            nome: Linux
            builder: --linux AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json
      - name: Dipendenze
        shell: bash
        run: |
          npm ci --prefix app
          npm ci --prefix desktop
      - name: App web + icone
        working-directory: desktop
        run: node prepara.mjs
      - name: Pacchetto
        working-directory: desktop
        run: npx electron-builder ${{ matrix.builder }} --publish never
      - name: Autoverifica (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: bash
        run: '"dist/win-unpacked/Il Viaggiatore.exe" --autoverifica'
      - name: Autoverifica (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: xvfb-run -a dist/linux-unpacked/il-viaggiatore --autoverifica --no-sandbox
