# Integrazione continua: a ogni push e pull request.
#
#  1. versioni coerenti (strumenti/versione.mjs verifica);
#  2. collaudo dell'avventura: compilazione, i nove finali, le prove mirate,
#     i salvataggi (salva → ricarica → stato identico);
#  3. pacchetti desktop Windows e Linux costruiti e AUTOVERIFICATI (il gioco
#     vero parte dentro il pacchetto, gioca, salva e ricarica).
#
#  Qui non si pubblica niente: le release le crea solo il workflow «Rilascio»,
#  a mano, dalla scheda Actions.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collaudo:
    name: Versioni e collaudo
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Versioni coerenti
        run: node strumenti/versione.mjs verifica
      - name: Diario di sviluppo ben formato
        run: node strumenti/diario.mjs verifica
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install lark==1.3.1
      - name: Compilazione
        run: python motore/favella.py compila prototipo/il-viaggiatore.fav
      - name: I nove finali
        working-directory: collaudo
        run: python finali.py
      - name: Prove mirate
        working-directory: collaudo
        run: python mirate.py
      - name: Salvataggi
        working-directory: collaudo
        run: python salvataggi.py -n 16

  desktop:
    name: Pacchetto ${{ matrix.nome }}
    needs: collaudo
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: Windows
            builder: --win nsis
          - os: ubuntu-latest
            nome: Linux
            builder: --linux AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json
      - name: Dipendenze
        shell: bash
        run: |
          npm ci --prefix app
          npm ci --prefix desktop
      - name: App web + icone
        working-directory: desktop
        run: node prepara.mjs
      - name: Pacchetto
        working-directory: desktop
        run: npx electron-builder ${{ matrix.builder }} --publish never
      - name: Autoverifica (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: bash
        run: '"dist/win-unpacked/Il Viaggiatore.exe" --autoverifica'
      - name: Autoverifica (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: xvfb-run -a dist/linux-unpacked/il-viaggiatore --autoverifica --no-sandbox
