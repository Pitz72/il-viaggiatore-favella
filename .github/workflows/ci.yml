# Integrazione continua: a ogni push e pull request.
#
#  1. il collaudo intero (collaudo.yml: versioni, diario e registro, i tipi e i hook
#     React, l'avventura, i salvataggi, la voce, la traduzione, l'esploratore);
#  2. pacchetti desktop Windows e Linux costruiti e AUTOVERIFICATI (il gioco
#     vero parte dentro il pacchetto, gioca, salva e ricarica).
#
#  Qui non si pubblica niente: le release le crea solo il workflow «Rilascio»,
#  a mano, dalla scheda Actions.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collaudo:
    name: Collaudo
    uses: ./.github/workflows/collaudo.yml
    with:
      partite: 16

  desktop:
    name: Pacchetto ${{ matrix.nome }}
    needs: collaudo
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: Windows
            builder: --win nsis
          - os: ubuntu-latest
            nome: Linux
            builder: --linux AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json
      - name: Dipendenze
        shell: bash
        run: |
          npm ci --prefix app
          npm ci --prefix desktop
      - name: App web + icone
        working-directory: desktop
        run: node prepara.mjs
      - name: Pacchetto
        working-directory: desktop
        run: npx electron-builder ${{ matrix.builder }} --publish never
      - name: Autoverifica (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: bash
        run: '"dist/win-unpacked/Il Viaggiatore.exe" --autoverifica'
      - name: Autoverifica (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: xvfb-run -a dist/linux-unpacked/il-viaggiatore --autoverifica --no-sandbox
