# Il sito su GitHub Pages: https://pitz72.github.io/il-viaggiatore-favella/
#
#  · alla radice la PRESENTAZIONE (pagine/, montata da strumenti/pagine.mjs): i quattro download
#    dell'ultima release, il gioco nel browser, le schermate, i numeri, i crediti; italiano e inglese;
#  · in gioca/ il GIOCO, costruito dal tag dell'ULTIMA RELEASE (non da main): nel browser si gioca
#    la stessa versione che si scarica.
#
#  Parte da sé alla fine del workflow «Rilascio» (che lo richiama), e si lancia anche a mano
#  (Actions → Pagine → Run workflow), per esempio dopo un ritocco alla presentazione.
#  Fra gli artefatti resta lo zip `Il-Viaggiatore-web.zip` del gioco, pronto per itch.io e simili.
#  I salvataggi, nel browser, stanno nel browser di chi gioca.
name: Pagine

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pagine
  cancel-in-progress: false

jobs:
  costruisci:
    name: Presentazione e gioco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: L'ultima release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Il gioco nel browser sarà la $TAG"
      - name: Il gioco di quella release
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: gioco
          persist-credentials: false
      - name: Costruisci il gioco
        run: |
          npm ci --prefix gioco/app
          npm run build --prefix gioco/app
      - name: Monta il sito
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node strumenti/pagine.mjs --gioco gioco --uscita sito --tag "${{ steps.release.outputs.tag }}"
      - name: Zip del gioco per itch.io e simili
        run: cd gioco/app/dist && zip -qr ../../../Il-Viaggiatore-web.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: Il-Viaggiatore-web
          path: Il-Viaggiatore-web.zip
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: sito

  pubblica:
    name: Pubblica
    needs: costruisci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
