<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Il Viaggiatore — icona. Il viandante in controluce davanti al sole basso,
       sulla terra crepata della Secca, in cammino verso ovest. Palette del trailer. -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171331"/>
      <stop offset="0.42" stop-color="#43203a"/>
      <stop offset="0.66" stop-color="#a2463a"/>
      <stop offset="0.74" stop-color="#e38a4c"/>
    </linearGradient>
    <radialGradient id="alone" cx="512" cy="700" r="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd8a0" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#f09a5a" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f09a5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset="1" stop-color="#f6b46c"/>
    </linearGradient>
    <linearGradient id="terra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e1712"/>
      <stop offset="1" stop-color="#0e0806"/>
    </linearGradient>
    <clipPath id="forma"><rect width="1024" height="1024" rx="200"/></clipPath>
  </defs>

  <g clip-path="url(#forma)">
    <rect width="1024" height="1024" fill="url(#cielo)"/>
    <rect width="1024" height="1024" fill="url(#alone)"/>
    <circle cx="512" cy="740" r="300" fill="url(#sole)"/>

    <!-- terra e orizzonte -->
    <rect x="0" y="740" width="1024" height="284" fill="url(#terra)"/>
    <rect x="0" y="736" width="1024" height="6" fill="#f6b46c" fill-opacity="0.6"/>
    <g fill="none" stroke="#f09a5a" stroke-opacity="0.16" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M470 760 L400 840 L300 1024"/>
      <path d="M400 840 L220 880"/>
      <path d="M560 760 L640 860 L780 1024"/>
      <path d="M640 860 L850 895"/>
    </g>
    <!-- ombra lunga verso est -->
    <path d="M500 742 L860 790 L870 800 L520 750 Z" fill="#000" fill-opacity="0.4"/>

    <!-- il viandante -->
    <g fill="#0c0605" stroke="#0c0605" stroke-linecap="round" stroke-linejoin="round">
      <!-- gambe: quella avanti (sinistra) e quella dietro -->
      <path d="M492 560 L452 650 L430 728" fill="none" stroke-width="36"/>
      <path d="M540 560 L578 648 L606 724" fill="none" stroke-width="36"/>
      <path d="M404 724 Q412 712 440 716 L452 734 Q430 742 404 736 Z" stroke-width="6"/>
      <path d="M596 714 Q624 712 640 726 L636 738 Q610 740 590 734 Z" stroke-width="6"/>
      <!-- cappotto -->
      <path d="M486 330 C466 356 458 440 452 572 C500 588 548 588 590 574 C588 480 578 380 556 332 Z" stroke-width="4"/>
      <!-- bisaccia -->
      <path d="M552 348 C604 348 622 402 616 470 C612 508 592 520 566 512 Z" stroke-width="4"/>
      <path d="M546 344 L604 390" fill="none" stroke="#2a1510" stroke-width="5"/>
      <!-- braccio dietro -->
      <path d="M556 356 L584 440 L596 470" fill="none" stroke-width="24"/>
      <!-- braccio avanti con la tanica -->
      <path d="M494 352 L460 420 L440 468" fill="none" stroke-width="26"/>
      <rect x="400" y="470" width="70" height="88" rx="12" stroke-width="2"/>
      <path d="M418 470 L418 452 L446 452 L446 470" fill="none" stroke-width="10"/>
      <!-- testa, collo, cappello a tesa larga -->
      <path d="M506 300 L510 336" fill="none" stroke-width="30"/>
      <circle cx="508" cy="282" r="36" stroke-width="2"/>
      <path d="M470 262 C472 222 544 222 548 262 Z" stroke-width="4"/>
      <ellipse cx="508" cy="262" rx="76" ry="14" stroke-width="2"/>
    </g>
  </g>
</svg>
